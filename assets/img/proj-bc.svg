<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Arduino code drawn by hand in a paint program">
  <!-- B.C. card thumbnail: code drawn with the pencil and text tools of a 1990s paint program -->
  <rect width="640" height="400" fill="#C0C0C0"/>
  <!-- title bar -->
  <rect x="0" y="0" width="640" height="26" fill="#000080"/>
  <text x="10" y="18" font-family="Tahoma, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#fff">untitled - Paint</text>
  <g font-family="Tahoma, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#000">
    <rect x="566" y="5" width="18" height="16" fill="#C0C0C0" stroke="#fff"/><text x="571" y="17">_</text>
    <rect x="588" y="5" width="18" height="16" fill="#C0C0C0" stroke="#fff"/><text x="592" y="17">□</text>
    <rect x="612" y="5" width="18" height="16" fill="#C0C0C0" stroke="#fff"/><text x="617" y="17">x</text>
  </g>
  <g font-family="Tahoma, Verdana, sans-serif" font-size="12" fill="#000"><text x="10" y="44">File</text><text x="44" y="44">Edit</text><text x="78" y="44">View</text><text x="118" y="44">Image</text><text x="166" y="44">Colors</text><text x="218" y="44">Help</text></g>
  <!-- tool box -->
  <g stroke="#808080" fill="#C0C0C0">
    <rect x="8" y="58" width="22" height="22"/><rect x="32" y="58" width="22" height="22"/>
    <rect x="8" y="82" width="22" height="22"/><rect x="32" y="82" width="22" height="22" fill="#fff"/>
    <rect x="8" y="106" width="22" height="22"/><rect x="32" y="106" width="22" height="22"/>
    <rect x="8" y="130" width="22" height="22"/><rect x="32" y="130" width="22" height="22"/>
  </g>
  <path d="M38 99l10-10 3 3-10 10-4 1z" fill="#E8C14A" stroke="#000" stroke-width="1"/>
  <text x="14" y="125" font-family="Times New Roman, serif" font-size="15" font-weight="bold">A</text>
  <path d="M12 140h14M19 133v14" stroke="#000"/>
  <!-- canvas -->
  <rect x="64" y="56" width="560" height="282" fill="#fff" stroke="#808080"/>
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="25">
    <text x="88" y="98" fill="#000" transform="rotate(-1.5 88 98)">void loop() {</text>
    <text x="120" y="138" fill="#0000FF" transform="rotate(1 120 138)">if (wifi.ok)</text>
    <text x="150" y="176" fill="#008000" transform="rotate(-1 150 176)">upload(photo);</text>
    <text x="120" y="216" fill="#000" transform="rotate(0.8 120 216)">delay(60000);</text>
    <text x="330" y="218" fill="#FF0000" font-size="20" transform="rotate(-3 330 218)">// is this right??</text>
    <text x="88" y="258" fill="#000" transform="rotate(2 88 258)">}</text>
  </g>
  <!-- a hand-drawn arrow and a smudge, pencil tool -->
  <path d="M332 232c-30 18-70 22-118 4" fill="none" stroke="#FF0000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M214 236l12-8M214 236l10 10" stroke="#FF0000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470 120c14-8 30-6 40 4s6 26-8 30-30-2-34-12 2-22 14-24" fill="none" stroke="#808080" stroke-width="2"/>
  <path d="M520 300l40-40 10 10-40 40-14 4z" fill="#E8C14A" stroke="#000"/><path d="M560 260l10 10 6-6-10-10z" fill="#F4A6A6" stroke="#000"/>
  <!-- color palette -->
  <g stroke="#808080">
    <rect x="8" y="350" width="34" height="34" fill="#000"/><rect x="11" y="353" width="16" height="16" fill="#fff"/>
    <rect x="48" y="350" width="16" height="16" fill="#000"/><rect x="48" y="368" width="16" height="16" fill="#fff"/>
    <rect x="66" y="350" width="16" height="16" fill="#808080"/><rect x="66" y="368" width="16" height="16" fill="#C0C0C0"/>
    <rect x="84" y="350" width="16" height="16" fill="#800000"/><rect x="84" y="368" width="16" height="16" fill="#FF0000"/>
    <rect x="102" y="350" width="16" height="16" fill="#808000"/><rect x="102" y="368" width="16" height="16" fill="#FFFF00"/>
    <rect x="120" y="350" width="16" height="16" fill="#008000"/><rect x="120" y="368" width="16" height="16" fill="#00FF00"/>
    <rect x="138" y="350" width="16" height="16" fill="#008080"/><rect x="138" y="368" width="16" height="16" fill="#00FFFF"/>
    <rect x="156" y="350" width="16" height="16" fill="#000080"/><rect x="156" y="368" width="16" height="16" fill="#0000FF"/>
    <rect x="174" y="350" width="16" height="16" fill="#800080"/><rect x="174" y="368" width="16" height="16" fill="#FF00FF"/>
  </g>
  <text x="440" y="378" font-family="Tahoma, Verdana, sans-serif" font-size="12" fill="#000">For Help, click Help Topics.</text>
</svg>
