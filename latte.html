<script>
(function () {
  const BASE = 'assets/img/latte/';
  const EXT  = 'jpg';

  const grid    = document.getElementById('latte-grid');
  const badge   = document.getElementById('latte-badge');
  const shuffle = document.getElementById('latte-shuffle');
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lightbox-img');
  const lbCap   = document.getElementById('lightbox-caption');
  const lbClose = document.getElementById('lightbox-close');
  const lbPrev  = document.getElementById('lightbox-prev');
  const lbNext  = document.getElementById('lightbox-next');

  // The photo set is whatever latte-dates.js knows about, so the count,
  // the date range and the grid can never drift apart.
  const dates = (typeof LATTE_DATES !== 'undefined') ? LATTE_DATES : {};
  const all = Object.keys(dates).map(Number).sort((a, b) => a - b);
  if (!all.length) { badge.textContent = 'No photos yet'; return; }

  const pad = (n) => String(n).padStart(3, '0');
  const label = (n) => dates[n] ? `#${pad(n)} · ${dates[n]}` : `#${pad(n)}`;

  badge.textContent = `${all.length} attempts · ${dates[all[0]]} to ${dates[all[all.length - 1]]}`;

  let order = [...all].reverse();   // newest first
  let current = 0;                  // index into `order` while the lightbox is open
  let lastFocus = null;

  function render() {
    const frag = document.createDocumentFragment();
    order.forEach((n, i) => {
      const cell = document.createElement('button');
      cell.className = 'latte-cell';
      cell.type = 'button';
      cell.setAttribute('aria-label', `Enlarge attempt ${n}, ${dates[n] || 'undated'}`);

      const img = document.createElement('img');
      img.src = `${BASE}${pad(n)}.${EXT}`;
      img.alt = '';
      img.loading = i < 12 ? 'eager' : 'lazy';
      img.decoding = 'async';
      cell.appendChild(img);

      const cap = document.createElement('span');
      cap.className = 'latte-caption';
      cap.textContent = label(n);
      cap.setAttribute('aria-hidden', 'true');
      cell.appendChild(cap);

      cell.addEventListener('click', () => open(i));
      frag.appendChild(cell);
    });
    grid.replaceChildren(frag);
  }

  function show(i) {
    current = (i + order.length) % order.length;
    const n = order[current];
    lbImg.src = `${BASE}${pad(n)}.${EXT}`;
    lbImg.alt = `Latte art attempt ${n}`;
    lbCap.textContent = label(n);
  }

  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }

  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
    if (lastFocus) lastFocus.focus();
  }

  render();

  shuffle.addEventListener('click', () => {
    for (let i = order.length - 1; i > 0; i--) {           // Fisher-Yates
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    render();
  });

  lbClose.addEventListener('click', close);
  lbPrev.addEventListener('click', () => show(current - 1));
  lbNext.addEventListener('click', () => show(current + 1));
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });

  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
    if (e.key === 'Tab') {                                  // keep focus inside the dialog
      const stops = [lbPrev, lbNext, lbClose];
      const i = stops.indexOf(document.activeElement);
      e.preventDefault();
      stops[(i + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
    }
  });
})();
</script>
